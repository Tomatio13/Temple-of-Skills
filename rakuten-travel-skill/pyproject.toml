[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rakuten-travel-skill"
version = "0.1.0"
description = "Agent Skill for Rakuten Travel vacancy search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
